services:
  couchdb:
    build: ./couchdb
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Defina COUCHDB_USER no .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Defina COUCHDB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS --user "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}" http://127.0.0.1:5984/_up || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  app:
    # Ative com --profile web; sem perfil, somente o banco sera iniciado.
    profiles: [web]
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env}
      COUCHDB_URL: http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-ecommerce_facamp}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      couchdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s

volumes:
  couchdb_data:
