services:
  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@localhost:5984/_up || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY}
      COUCHDB_URL: http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984
      COUCHDB_DATABASE: ${COUCHDB_DATABASE}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb_data: