{% extends "base.html" %}{% block title %}Entrar{% endblock %}{% block content %}<section class="card form-card"><span class="eyebrow">Bem-vindo de volta</span><h1 style="font-size:2.2rem;margin:10px 0 8px">Entre na sua tripulação</h1><p class="muted">Acesse seus pedidos e continue sua coleção.</p><form method="post" style="margin-top:26px"><div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email" autocomplete="email" required placeholder="voce@email.com"></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" name="senha" autocomplete="current-password" required placeholder="Sua senha"></div><button class="btn full" type="submit">Entrar na conta</button></form><p class="muted" style="text-align:center;margin:20px 0 0;font-size:13px">Ainda não tem conta? <a style="color:var(--red);font-weight:800" href="{{url_for('cadastro')}}">Crie agora</a></p></section>{% endblock %}
