{% extends "base.html" %}{% block title %}Criar conta{% endblock %}{% block content %}<section class="card form-card"><span class="eyebrow">Comece sua jornada</span><h1 style="font-size:2.2rem;margin:10px 0 8px">Crie sua conta</h1><p class="muted">Salve seus pedidos e acompanhe a evolução da sua coleção.</p><form method="post" style="margin-top:26px"><input type="hidden" name="csrf_token" value="{{form_csrf_token()}}"><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" maxlength="80" autocomplete="name" required placeholder="Monkey D. Luffy"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email" maxlength="254" autocomplete="email" required placeholder="voce@email.com"></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" name="senha" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres"></div><div class="field"><label for="confirmacao">Confirme sua senha</label><input id="confirmacao" type="password" name="confirmacao" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Repita sua senha"></div><button class="btn full" type="submit">Criar minha conta</button></form><p class="muted" style="text-align:center;margin:20px 0 0;font-size:13px">Já tem conta? <a style="color:var(--red);font-weight:800" href="{{url_for('login')}}">Entrar</a></p></section>{% endblock %}
