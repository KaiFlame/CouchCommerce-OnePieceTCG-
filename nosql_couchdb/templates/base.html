<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FACAMP NoSQL Shop</title><style>body{font-family:Arial;margin:0;background:#f5f8fa;color:#16314a}header{padding:16px;background:linear-gradient(90deg,#062d56,#8e0038);color:#fff}nav{display:flex;gap:14px;flex-wrap:wrap}nav a{color:#fff;font-weight:bold;text-decoration:none}main{max-width:1050px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #d6e4ec;border-radius:16px;padding:18px}.btn{background:#efad29;border:0;border-radius:10px;padding:10px 14px;font-weight:bold}.flash{background:#eef5ff;border-left:5px solid #0a3d73;padding:10px;margin-bottom:10px}.price{font-size:22px;font-weight:bold;color:#8e0038}input{width:100%;padding:10px;margin:5px 0 12px;box-sizing:border-box}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border:1px solid #d6e4ec}th{background:#0a3d73;color:#fff}</style></head><body><header><h2>FACAMP NoSQL Shop · CouchDB + Flask</h2><nav><a href="{{url_for('catalogo')}}">Catálogo</a><a href="{{url_for('carrinho')}}">Carrinho</a>{% if session.get('cliente_id') %}<a href="{{url_for('pedidos')}}">Meus pedidos</a><a href="{{url_for('logout')}}">Sair</a>{% else %}<a href="{{url_for('cadastro')}}">Cadastro</a><a href="{{url_for('login')}}">Login</a>{% endif %}</nav></header><main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
