{% extends "base.html" %}{% block content %}<h1>Catálogo</h1><div class="grid">{% for p in produtos %}<div class="card"><h3>{{p.nome}}</h3><p>{{p.categoria}}</p><p class="price">R$ {{"%.2f"|format(p.preco)}}</p><p>Estoque: {{p.estoque}}</p><form method="post" action="{{url_for('adicionar',produto_id=p._id)}}"><button class="btn">Adicionar</button></form></div>{% endfor %}</div>{% endblock %}
