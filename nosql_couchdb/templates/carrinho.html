{% extends "base.html" %}{% block content %}<h1>Carrinho</h1>{% if itens %}<table><tr><th>Produto</th><th>Qtd</th><th>Subtotal</th></tr>{% for i in itens %}<tr><td>{{i.produto.nome}}</td><td>{{i.qtd}}</td><td>R$ {{"%.2f"|format(i.subtotal)}}</td></tr>{% endfor %}</table><h3>Total: R$ {{"%.2f"|format(total)}}</h3><form method="post" action="{{url_for('checkout')}}"><button class="btn">Finalizar</button></form>{% else %}<p>Carrinho vazio.</p>{% endif %}{% endblock %}
